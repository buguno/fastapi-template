[project]
name = "fastapi-template"
version = "0.1.0"
description = ""
authors = [
    {name = "buguno",email = "brunnodesouzabezerra@gmail.com"}
]
requires-python = ">=3.14,<4.0"

dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.52,<3.0.0)",
    "alembic (>=1.19.1,<2.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "greenlet (>=3.5.5,<4.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)"
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.16.3,<0.17.0)",
    "typos (>=1.49.0,<2.0.0)",
    "pytest-random-order (>=1.2.0,<2.0.0)",
    "faker (>=40.36.0,<41.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "testcontainers (>=4.15.0,<5.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "freezegun (>=1.5.5,<2.0.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest]
pythonpath = ['.']
addopts = ['-p', 'no:warnings', '--cov=app', '--cov-context=test', '--cov-branch', '--random-order']
asyncio_default_fixture_loop_scope = 'function'

[tool.typos.default]
extend-ignore-identifiers-re = ["selectin"]

[tool.coverage.run]
core = "ctrace"
concurrency = ["thread", "greenlet"]

[tool.typos.files]
extend-exclude = ["*.md"]

[tool.poe]
poetry_command = ""

[tool.poe.tasks]
lint = { cmd = "ruff check" }
format.sequence = [
    { cmd = "ruff check --fix" },
    { cmd = "ruff format" },
]
serve = "fastapi dev app/main.py"
test.sequence = [
    "lint",
    { cmd = "pytest -s -x -vv $POE_EXTRA_ARGS" },
    { cmd = "coverage html --show-contexts" },
]
